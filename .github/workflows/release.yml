name: Build and Release

# Релиз собирается из двух архивов, которые тянет менеджер:
#   Zapret_DPI_Manager.tar.gz — установщик (install_zapret.sh) и полный пакет;
#   zapret_updater.tar.gz     — автообновление (без пользовательских файлов).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v2.7.8.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show version
        run: head -n 1 version.txt

      - name: Check tag matches version.txt
        run: |
          VERSION="$(head -n 1 version.txt | tr -d '[:space:]')"
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "${REF#v}" != "$VERSION" ]; then
            echo "тег $REF не совпадает с version.txt ($VERSION)" >&2
            exit 1
          fi

      - name: Build release archives
        run: |
          chmod +x tools/build_release.sh
          tools/build_release.sh

      # Системные библиотеки для проверки импорта Qt из бандла на раннере.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Prebuilt-бандл PySide6/Qt: пользователю не нужно ставить пакеты и разблокировать /usr.
      - name: Build PySide6 vendor bundle
        run: |
          chmod +x tools/build_vendor.sh
          tools/build_vendor.sh

      - name: Verify archives
        run: |
          tar tzf dist/Zapret_DPI_Manager.tar.gz | grep -q '^\./main.py$'
          tar tzf dist/Zapret_DPI_Manager.tar.gz | grep -q '^\./zapret/bins/x86_64/nfqws$'
          tar tzf dist/pyside6_vendor.tar.gz | grep -q '^vendor/PySide6/__init__.py$'
          tar tzf dist/pyside6_vendor.tar.gz | grep -q '^vendor/PySide6/Qt/qml/QtQuick/'
          if tar tzf dist/zapret_updater.tar.gz | grep -qE 'config\.txt|_user\.txt'; then
            echo "updater must not contain user files" >&2
            exit 1
          fi

      - name: Create SHA256SUMS
        run: |
          cd dist
          sha256sum Zapret_DPI_Manager.tar.gz zapret_updater.tar.gz pyside6_vendor.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/Zapret_DPI_Manager.tar.gz
            dist/zapret_updater.tar.gz
            dist/pyside6_vendor.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
