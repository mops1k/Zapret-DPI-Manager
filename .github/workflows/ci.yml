name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0

      - name: Install ruff and PySide6
        run: |
          pip install ruff PySide6

      - name: Python syntax
        run: python -m compileall -q core qmlui tools main.py

      - name: Shell syntax
        run: |
          for file in zapret/system/*.sh warp/system/*.sh tools/*.sh installer/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done

      - name: WARP scripts on the stub stand
        run: sudo bash tools/check_warp_scripts.sh

      - name: QML self-test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python main.py --selftest

      - name: Strategy files (placeholders, format)
        run: python tools/validate_strategies.py

      - name: Flowseal conversion matches files/strategy
        run: python tools/convert_flowseal_strategies.py --check

      - name: goodbyeDPI-UI import matches files/strategy
        run: python tools/import_goodbyedpi_ui.py --check

      - name: BB DPI conversion (ciadpi -> nfqws, dry-run)
        run: python tools/check_bbdpi_convert.py

      - name: GitHub fetch chain (offline)
        run: python tools/check_github_fetch.py

      - name: Lint (ruff)
        run: ruff check core qmlui tools main.py
